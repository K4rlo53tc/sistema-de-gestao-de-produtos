<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Gestão de Produtos</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<main>
    <h1>Gestão de Produtos</h1>

    <section class="cartao">
        <h2 id="titulo-form">Novo produto</h2>

        <form id="form-produto" novalidate>
            <!-- Fica vazio ao cadastrar; guarda o id quando estamos a editar -->
            <input type="hidden" id="produto-id">

            <label>Nome
                <input type="text" id="nome" maxlength="50" required>
            </label>
            <label>Categoria
                <input type="text" id="categoria" maxlength="50" required>
            </label>
            <label>Preço (Kz)
                <input type="number" id="preco" step="0.01" min="0.01" required>
            </label>
            <label>Quantidade
                <input type="number" id="quantidade" min="0" step="1" required>
            </label>
            <label class="larga">Descrição (opcional)
                <input type="text" id="descricao" maxlength="100">
            </label>

            <div class="botoes larga">
                <button type="submit" id="btn-guardar">Cadastrar</button>
                <button type="button" id="btn-cancelar" class="secundario" hidden>Cancelar edição</button>
            </div>
        </form>

        <p id="mensagem" role="alert"></p>
    </section>

    <section class="cartao">
        <div class="topo-tabela">
            <h2>Produtos <span id="contador"></span></h2>
            <input type="search" id="pesquisa" placeholder="Pesquisar por nome ou categoria...">
        </div>

        <div class="tabela-wrapper">
            <table>
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Nome</th>
                    <th>Descrição</th>
                    <th>Preço</th>
                    <th>Qtd</th>
                    <th>Categoria</th>
                    <th>Cadastro</th>
                    <th>Acções</th>
                </tr>
                </thead>
                <tbody id="tabela-produtos"></tbody>
            </table>
        </div>
        <p id="vazio" hidden>Sem produtos para mostrar.</p>
    </section>
</main>

<script src="app.js"></script>
</body>
</html>
